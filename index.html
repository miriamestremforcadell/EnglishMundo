<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#3f51b5">
<meta name="description" content="EnglishMundo: actividades de inglés para practicar vocabulario, comprensión y gramática.">
<link rel="manifest" href="./manifest.webmanifest">

<title>EnglishMundo</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(#bfe9ff,#eaf8ff) fixed;color:#263238;min-height:100vh}
#app{max-width:900px;margin:0 auto;padding:16px}
h1,h2,h3{margin:.3em 0}
.btn{border:0;border-radius:18px;padding:14px 20px;font-size:20px;font-weight:700;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.15);cursor:pointer;color:inherit;font-family:inherit}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.primary{background:#ff9800;color:#fff}
.green{background:#43a047;color:#fff}
.red{background:#ef5350;color:#fff}
.blue{background:#3f51b5;color:#fff}
.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 4px 12px rgba(0,0,0,.08);margin-bottom:14px}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.hud{display:flex;gap:8px;align-items:center;font-size:20px;font-weight:700;flex-wrap:wrap}
.pill{background:#fff;border-radius:20px;padding:6px 14px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.profiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.prof{font-size:28px;padding:28px 10px;text-align:center;width:100%}
.prof .av{font-size:64px;display:block}
.bar{height:22px;background:#e0e0e0;border-radius:11px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#66bb6a,#43a047);border-radius:11px;transition:width .4s}
.bar.sm{height:12px}
.islands{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.island{text-align:center;padding:14px 10px;width:100%}
.island .ic{font-size:46px;display:block}
.island .nm{font-size:18px;display:block;margin:4px 0 8px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.q{text-align:center}
.qpic{font-size:110px;line-height:1.15;margin:8px 0}
.sw{display:inline-block;width:110px;height:110px;border-radius:50%;border:4px solid #cfd8dc;vertical-align:middle}
.opt .sw{width:64px;height:64px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.opt{font-size:26px;padding:16px 8px;min-height:84px}
.opt.big{font-size:60px;padding:8px}
.opt.ok{background:#66bb6a !important;color:#fff}
.opt.bad{background:#ef5350 !important;color:#fff}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:14px 0}
.tile{width:58px;height:62px;font-size:30px;padding:0}
.tile.used{opacity:.25}
.slot{min-height:66px;font-size:42px;letter-spacing:6px;border-bottom:4px dashed #90a4ae;margin:10px auto;max-width:520px;font-weight:700}
.words{display:flex;flex-wrap:wrap;gap:8px}
.wchip{padding:8px 12px;border-radius:14px;background:#eceff1;font-size:18px;border:0;font-family:inherit;cursor:pointer}
.wchip.l{background:#c8e6c9}
.wchip.p{background:#fff59d}
.center{text-align:center}
.big{font-size:24px}
.muted{color:#78909c}
.fb{font-size:24px;font-weight:700;min-height:36px;margin-top:12px}
.speak{font-size:40px;padding:10px 28px}
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;font-size:46px;text-align:center}
.path{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;font-weight:700}
.step{padding:8px 14px;border-radius:16px;background:#eceff1}
.step.done{background:#c8e6c9}
.step.now{background:#ff9800;color:#fff}
table{width:100%;border-collapse:collapse}
td,th{padding:6px;border-bottom:1px solid #eee;text-align:left;font-size:16px}
input{font-size:28px;padding:10px;border-radius:12px;border:2px solid #cfd8dc;width:140px;text-align:center}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
.pop{animation:pop .4s}
@media (max-width:520px){.qpic{font-size:84px}.opt{font-size:22px}.prof .av{font-size:64px}}
</style>
</head>

T("s-prep",0,"📦","Preposiciones: in, on, under…",
 "Lugar: <b>in</b> = dentro · <b>on</b> = encima · <b>under</b> = debajo · <b>behind</b> = detrás · <b>in front of</b> = delante · <b>next to</b> = al lado · <b>between</b> = entre. Tiempo: <b>in</b> the morning, <b>on</b> Monday.",

T("s-imp",0,"📢","Órdenes y Let's",
 "Para dar órdenes usamos el verbo solo: <b>Sit down!</b> Para decir que no: <b>Don't</b> + verbo. Para proponer algo: <b>Let's</b> + verbo (¡vamos a…!).",
 [["+","Open the door, please.","Abre la puerta, por favor."],["−","Don't run!","¡No corras!"],["+","Let's play!","¡Vamos a jugar!"]],
 [["___ the window, please.",["Close","Closes","Closing"]],["___ touch the cake!",["Don't","Not","No"]],["___ go to the park!",["Let's","Lets","Let"]],["Please ___ down.",["sit","sits","sitting"]],["Let's ___ a picture.",["draw","draws","drawing"]],["Don't ___ in the classroom.",["shout","shouts","shouting"]]],

 [["You run.","Dale la orden en negativo (Don't)","Don't run!",["Not","runs"]],["We go to the beach.","Usa Let's","Let's go to the beach.",["We","goes"]]]);

T("s-like",0,"❤️","Like + -ing y would like",
 "Para lo que te gusta <b>hacer</b>: <b>like / love / don't like</b> + verbo con <b>-ing</b>: I like swimming. Para pedir algo con educación: <b>I'd like</b> (I would like) + cosa, o <b>to</b> + verbo. Pregunta: <b>Would you like…?</b>",
 [["+","I like swimming.","Me gusta nadar."],["−","She doesn't like singing.","A ella no le gusta cantar."],["?","Would you like a drink? Yes, please.","¿Quieres algo de beber? Sí, por favor."],["+","I'd like to go to the zoo.","Me gustaría ir al zoo."]],
 [["I like ___ football.",["playing","play","plays"]],["She loves ___.",["dancing","dance","dances"]],["___ you like some cake?",["Would","Do","Are"]],["I'd like ___ a picture.",["to draw","draw","drawing"]],["Do you like ___?",["reading","read","reads"]],["Swimming ___ fun!",["is","are","am"]]],
 ["I like riding my bike.","Would you like an apple?","I'd like to play.","He loves reading comics."],
 [["I play tennis.","Usa I like + -ing","I like playing tennis.",["play","likes"]],["Do you want a drink?","Pregunta con Would","Would you like a drink?",["Do","want"]]]);

T("s-and",0,"🔗","Unir frases: and, but, or",
 "<b>and</b> = y · <b>but</b> = pero · <b>or</b> = o. Ejemplo: I like cats <b>but</b> I don't like dogs.",
 [["+","I have got a cat and a dog.","Tengo un gato y un perro."],["+","I like apples but I don't like pears.","Me gustan las manzanas pero no las peras."],["?","Do you want milk or water?","¿Quieres leche o agua?"]],
 [["I like fish ___ chips.",["and","but","or"]],["She can swim ___ she can't ride a bike.",["but","and","or"]],["Is it big ___ small?",["or","and","but"]],["My dog is black ___ white.",["and","or","but"]],["It's sunny ___ it's cold.",["but","or","and"]],["Do you want a pen ___ a pencil?",["or","but","and"]]],
 ["I like cats and dogs.","Is it red or blue?","He is small but he is strong.","I have got a brother and a sister."],
 []);

T("s-phr",0,"💬","Frases útiles de Starters",
 "Frases que salen mucho en el examen: <b>Here you are</b> (aquí tienes) · <b>Me too!</b> (¡yo también!) · <b>So do I</b> (a mí también) · <b>What a …!</b> (¡qué …!) · <b>Happy birthday!</b> · <b>What now?</b> (¿y ahora qué?).",
 [["+","Can I have the ball? Here you are.","¿Me das la pelota? Aquí tienes."],["+","I love chocolate. So do I!","Me encanta el chocolate. ¡A mí también!"],["+","What a beautiful bird!","¡Qué pájaro tan bonito!"],["+","Happy birthday! Thank you!","¡Feliz cumpleaños! ¡Gracias!"]],
 [["Can I have your pen? Yes, here you ___.",["are","is","go"]],["I like ice cream. ___ do I!",["So","Me","Too"]],["I'm hungry. ___ too!",["Me","I","So"]],["What ___ funny dog!",["a","an","the"]],["What ___ ugly monster!",["an","a","the"]],["It's my birthday! Happy ___!",["birthday","day","party"]]],
 ["What a big elephant!","So do I!","Here you are.","What a lovely day!"],
 []);

T("m-was",1,"⏪","Pasado: was / were",
 "El pasado de am / is es <b>was</b>; el de are es <b>were</b>. Negativa: <b>wasn't / weren't</b>. Pregunta: <b>Was he…? Were you…?</b>",
 [["+","I was at home yesterday.","Ayer estaba en casa."],["+","They were happy.","Estaban contentos."],["−","It wasn't cold.","No hacía frío."],["?","Were you at the park? Yes, I was.","¿Estabas en el parque? Sí."]],
 [["Yesterday I ___ tired.",["was","were","am"]],["We ___ at the beach last week.",["were","was","are"]],["___ she at school on Monday?",["Was","Were","Is"]],["The film ___ very good. I didn't like it.",["wasn't","weren't","isn't"]],["Were they hungry? Yes, they ___.",["were","was","are"]],["Where ___ you yesterday?",["were","was","are"]]],
 ["I was at home yesterday.","Were you at the zoo?","It wasn't sunny.","Where was your dog?"],
 [["He is sad.","Pásala al pasado ⏪","He was sad.",["were","is"]],["They are at school.","Pásala al pasado ⏪","They were at school.",["was","are"]],["You were tired.","Haz la pregunta ❓","Were you tired?",["Was","Did"]]]);

T("m-past",1,"📼","Pasado regular: -ed y did",
 "Para lo que <b>pasó</b>: verbo + <b>-ed</b> (played, watched). Es igual para todas las personas. Negativa: <b>didn't</b> + verbo normal. Pregunta: <b>Did you…?</b> + verbo normal.",
 [["+","I played football yesterday.","Ayer jugué al fútbol."],["−","She didn't watch TV.","Ella no vio la tele."],["?","Did you like the film? Yes, I did.","¿Te gustó la peli? Sí."]],
 [["Last Sunday we ___ a cake.",["cooked","cook","cooks"]],["She ___ to music yesterday.",["listened","listen","listens"]],["___ you play tennis last week?",["Did","Do","Were"]],["I didn't ___ my homework.",["finish","finished","finishes"]],["Did he walk to school? No, he ___.",["didn't","wasn't","doesn't"]],["They ___ in the park last summer.",["played","play","playing"]]],
 ["We watched a film last night.","Did you visit your grandma?","He didn't clean his room.","She laughed at the clown."],
 [["I play with my friends.","Pásala al pasado ⏪","I played with my friends.",["play","did"]],["You liked the cake.","Haz la pregunta ❓","Did you like the cake?",["liked","Do"]],["She watched TV.","Hazla negativa ➖","She didn't watch TV.",["watched","doesn't"]]]);

T("m-irr",1,"🌀","Pasado irregular",
 "Algunos verbos cambian en pasado y hay que aprenderlos: go → <b>went</b>, see → <b>saw</b>, eat → <b>ate</b>, have → <b>had</b>, buy → <b>bought</b>, swim → <b>swam</b>, take → <b>took</b>, come → <b>came</b>, run → <b>ran</b>, make → <b>made</b>. Con <b>didn't</b> y <b>Did…?</b> el verbo vuelve a ser normal.",
 [["+","We went to the zoo.","Fuimos al zoo."],["+","I saw a whale!","¡Vi una ballena!"],["−","He didn't go to school.","No fue al colegio."],["?","Did you eat pizza? Yes, I did.","¿Comiste pizza? Sí."]],
 [["Yesterday I ___ to the cinema.",["went","goed","go"]],["We ___ a big shark at the aquarium.",["saw","seed","see"]],["She ___ a sandwich for lunch.",["ate","eated","eats"]],["Did you ___ a good holiday?",["have","had","has"]],["My dad ___ me a new bike.",["bought","buyed","buy"]],["They ___ in the sea last summer.",["swam","swimmed","swim"]],["I ___ lots of photos.",["took","taked","take"]],["We didn't ___ to the party.",["go","went","goes"]]],
 ["We went to the beach.","I ate a big ice cream.","Did you see the monkeys?","My friend came to my house."],
 [["I go to the park.","Pásala al pasado ⏪","I went to the park.",["go","goed"]],["She sees a dolphin.","Pásala al pasado ⏪","She saw a dolphin.",["sees","seed"]],["You went to London.","Haz la pregunta ❓","Did you go to London?",["went","Do"]]]);

T("m-comp",1,"📏","Comparativos y superlativos",
 "Comparar dos: palabra corta + <b>-er than</b> (bigger than) · palabra larga: <b>more … than</b>. El que más: <b>the …-est</b> (the biggest) · <b>the most …</b>. Irregulares: good → <b>better</b> → <b>the best</b>; bad → <b>worse</b> → <b>the worst</b>.",
 [["+","An elephant is bigger than a dog.","Un elefante es más grande que un perro."],["+","This is the tallest tree in the park.","Es el árbol más alto del parque."],["+","My book is more interesting than yours.","Mi libro es más interesante que el tuyo."],["+","You are my best friend.","Eres mi mejor amigo."]],
 [["A car is ___ than a bike.",["faster","fast","fastest"]],["Who is the ___ in your class?",["tallest","taller","tall"]],["This film is ___ than that one.",["better","gooder","best"]],["My sister is ___ than me.",["older","old","oldest"]],["This is the ___ day of my life!",["best","better","good"]],["A whale is ___ than a fish.",["bigger","biger","biggest"]],["This book is ___ beautiful than that one.",["more","most","much"]],["Today is ___ than yesterday. It's raining!",["worse","badder","worst"]]],
 ["My dog is bigger than your cat.","She is the best singer.","Lions are stronger than monkeys.","This is the most beautiful beach."],
 [["My bag is big. Your bag is small.","Compara (-er than)","My bag is bigger than your bag.",["big","more"]],["Tom is tall. (de la clase)","Usa el superlativo","Tom is the tallest in the class.",["taller","most"]]]);

T("m-adv",1,"🐢","Adverbios: cómo y cada cuánto",
 "Para decir <b>cómo</b> haces algo: adjetivo + <b>-ly</b> (slow → slowly, quiet → quietly). Irregulares: good → <b>well</b>, fast → <b>fast</b>. Para comparar: <b>faster, better, more slowly</b>. Cada cuánto: <b>always, often, sometimes, never</b> (van antes del verbo).",
 [["+","The snail moves slowly.","El caracol se mueve despacio."],["+","She sings very well.","Canta muy bien."],["+","I always brush my teeth.","Siempre me lavo los dientes."],["+","He runs faster than me.","Corre más rápido que yo."]],
 [["Please talk ___. The baby is sleeping.",["quietly","quiet","quieter"]],["She plays the piano very ___.",["well","good","goodly"]],["I ___ eat breakfast. Every day!",["always","never","sometimes"]],["He runs ___ than his brother.",["faster","fastly","more fast"]],["The tortoise walks very ___.",["slowly","slow","slowest"]],["I ___ go to bed late. Only at weekends.",["sometimes","always","never"]]],
 ["She always walks to school.","He reads very quickly.","I never eat meat.","You dance better than me."],
 [["He is a slow walker.","Usa el adverbio (-ly)","He walks slowly.",["slow","walk"]],["I go to the park.","Añade always (siempre)","I always go to the park.",["never","goes"]]]);

T("m-must",1,"⚠️","Must / have to / had to",
 "Obligación: <b>must</b> + verbo (You must listen). También <b>have to / has to</b> + verbo. Prohibido: <b>mustn't</b>. En pasado: <b>had to</b>. Pregunta: <b>Do you have to…?</b>",
 [["+","You must wear a helmet.","Debes llevar casco."],["+","She has to do her homework.","Tiene que hacer los deberes."],["−","You mustn't run here.","No debes correr aquí."],["+","Yesterday I had to clean my room.","Ayer tuve que limpiar mi cuarto."]],
 [["It's late. You ___ go to bed.",["must","mustn't","can"]],["He ___ to wear glasses.",["has","have","must"]],["You ___ touch the fire! It's hot.",["mustn't","must","have to"]],["Last week I ___ to see the doctor.",["had","have","must"]],["Do you ___ to wear a uniform?",["have","has","must"]],["We ___ be quiet in the library.",["must","mustn't","has"]]],
 ["You must wash your hands.","I have to go home now.","You mustn't eat in class.","She had to wait for the bus."],
 [["I have to study.","Pásala al pasado ⏪","I had to study.",["have","must"]],["She must help.","Usa has to","She has to help.",["have","must"]],["You have to go.","Haz la pregunta ❓","Do you have to go?",["Have","Does"]]]);

T("m-could",1,"🙋","Could y Shall I…?",
 "<b>could</b> es el pasado de can: When I was three, I <b>could</b> swim. Negativa: <b>couldn't</b>. Para ofrecer ayuda: <b>Shall I</b> + verbo? (¿Quieres que…?).",
 [["+","When I was five, I could ride a bike.","Con cinco años sabía ir en bici."],["−","I couldn't find my shoes.","No encontraba mis zapatos."],["?","Shall I open the window?","¿Abro la ventana?"]],
 [["When she was four, she ___ read.",["could","can","cans"]],["I ___ sleep last night. It was too hot.",["couldn't","can't","don't"]],["___ I help you with your bag?",["Shall","Do","Am"]],["___ you swim when you were six?",["Could","Can","Did"]],["Shall I ___ the door for you?",["open","opens","opening"]],["Yesterday we ___ see the moon. It was beautiful.",["could","can","shall"]]],
 ["Shall I carry your bag?","I could play the piano.","He couldn't find his cat.","Could you swim last year?"],
 [["I can climb trees.","Pásala al pasado ⏪","I could climb trees.",["can","did"]],["She can't come.","Pásala al pasado ⏪","She couldn't come.",["can't","didn't"]]]);

T("m-verb",1,"➡️","Verbo + to / verbo + -ing",
 "Algunos verbos van con <b>to</b> + verbo: want to, need to, learn to, start to, try to. Otros con <b>-ing</b>: like, love, enjoy, stop, finish, go (go swimming). Para decir <b>para qué</b>: <b>to</b> + verbo (I went to the shop <b>to buy</b> milk).",
 [["+","I want to be a pilot.","Quiero ser piloto."],["+","She enjoys reading.","Disfruta leyendo."],["+","We went to the park to play.","Fuimos al parque a jugar."],["+","Let's go swimming!","¡Vamos a nadar!"]],
 [["I want ___ a new bike.",["to buy","buying","buy"]],["She enjoys ___ pictures.",["painting","to paint","paint"]],["He went to the shop ___ some bread.",["to buy","buying","for buy"]],["Did you finish ___ your book?",["reading","to read","read"]],["We go ___ every Saturday.",["swimming","to swim","swim"]],["I'm learning ___ the guitar.",["to play","playing","play"]]],
 ["I want to learn English.","She stopped crying.","He went home to sleep.","We love going to the beach."],
 [["I went to the library. I read books there.","Une con to (para qué)","I went to the library to read books.",["reading","for"]],["She likes to swim.","Usa enjoys + -ing","She enjoys swimming.",["swim","to"]]]);

T("m-ask",1,"🙏","Want / ask someone to… y give it to me",
 "Para pedir o querer que <b>otra persona</b> haga algo: <b>want / ask</b> + persona + <b>to</b> + verbo. Para dar algo a alguien: give <b>me</b> the book = give the book <b>to me</b>.",
 [["+","Mum wants me to tidy my room.","Mamá quiere que ordene mi cuarto."],["+","The teacher asked us to sit down.","La profe nos pidió que nos sentáramos."],["+","Give the ball to Tom.","Dale la pelota a Tom."],["?","Can you send me a photo?","¿Me envías una foto?"]],
 [["I want you ___ me.",["to help","help","helping"]],["She asked ___ to close the door.",["me","I","my"]],["Dad wants ___ to come home.",["us","we","our"]],["Give the book ___ your sister.",["to","for","at"]],["The teacher asked them ___ quiet.",["to be","be","being"]],["Can you give ___ the salt, please?",["me","I","to me"]]],
 ["My mum wants me to read.","Give the pen to me.","He asked her to dance.","Show me your picture."],
 [["\"Help me!\" said Mum.","Empieza: Mum asked me…","Mum asked me to help her.",["helping","she"]],["Give me the cup.","Usa to me","Give the cup to me.",["for","I"]]]);

T("m-rel",1,"🔍","Who / which / where para describir",
 "Para dar más información: personas → <b>who</b> · cosas y animales → <b>which</b> · lugares → <b>where</b>.",
 [["+","The man who is singing is my uncle.","El hombre que está cantando es mi tío."],["+","This is the cat which lives next door.","Este es el gato que vive al lado."],["+","This is the park where I play.","Este es el parque donde juego."]],
 [["The girl ___ is dancing is my friend.",["who","which","where"]],["That's the shop ___ I buy comics.",["where","who","which"]],["I like the dog ___ has got black ears.",["which","who","where"]],["A nurse is a person ___ helps doctors.",["who","which","where"]],["This is the house ___ my grandma lives.",["where","who","which"]],["The book ___ is on the table is mine.",["which","who","where"]]],
 ["The boy who is running is Sam.","This is the school where I study.","I want the cake which has got chocolate.","She is the girl who lives here."],
 [["This is my friend. She plays tennis.","Une con who","This is my friend who plays tennis.",["which","she"]],["This is the park. I play here.","Une con where","This is the park where I play.",["who","here"]]]);

T("m-when",1,"🔗","Because y when",
 "<b>because</b> = porque (para explicar por qué) · <b>when</b> = cuando. Para preguntar por qué: <b>Why…?</b> → <b>Because…</b>",
 [["+","I'm happy because it's my birthday.","Estoy contento porque es mi cumple."],["+","When I was small, I lived in Madrid.","Cuando era pequeño vivía en Madrid."],["?","Why are you sad? Because I lost my toy.","¿Por qué estás triste? Porque perdí mi juguete."]],
 [["I'm wearing a coat ___ it's cold.",["because","when","but"]],["___ I was three, I had a red bike.",["When","Because","Why"]],["___ are you laughing? Because the film is funny.",["Why","When","Because"]],["She was tired ___ she ran a lot.",["because","when","or"]],["___ it rains, I play inside.",["When","Because","Why"]],["He didn't come to school ___ he was ill.",["because","when","and"]]],
 ["I like summer because it is hot.","When I was five I lived here.","Why are you happy?","She is tired because she ran."],
 [["I am hungry. I didn't eat lunch.","Une con because","I am hungry because I didn't eat lunch.",["when","so"]]]);

T("m-time",1,"⏰","Preposiciones de tiempo",
 "<b>at</b> + hora (at 5 o'clock) · <b>on</b> + día (on Monday) · <b>in</b> + parte del día, mes o estación (in the morning, in May, in summer) · <b>before</b> = antes de · <b>after</b> = después de.",
 [["+","School starts at nine o'clock.","El cole empieza a las nueve."],["+","My birthday is in May.","Mi cumple es en mayo."],["+","I play after school.","Juego después del cole."]],
 [["I get up ___ seven o'clock.",["at","on","in"]],["We go swimming ___ Saturday.",["on","at","in"]],["It snows ___ winter.",["in","on","at"]],["Wash your hands ___ lunch.",["before","at","on"]],["I watch TV ___ dinner.",["after","on","in"]],["My party is ___ Friday.",["on","in","at"]]],
 ["I go to bed at nine.","We have English on Monday.","I play football after school.","It is hot in summer."],
 []);

T("m-phr",1,"💬","Preguntas y frases de Movers",
 "<b>What's the weather like?</b> (¿qué tiempo hace?) · <b>What's the matter?</b> (¿qué te pasa?) · <b>What about…? / How about…?</b> (¿y si…?) · <b>be called</b> (llamarse) · <b>be good at</b> (ser bueno en) · <b>go for a walk</b> (ir a dar un paseo) · <b>I think / I know</b>.",
 [["?","What's the weather like? It's sunny.","¿Qué tiempo hace? Hace sol."],["?","What's the matter? I've got a headache.","¿Qué te pasa? Me duele la cabeza."],["+","I'm good at drawing.","Se me da bien dibujar."],["?","What about going to the park?","¿Qué tal si vamos al parque?"]],
 [["What's the weather ___? It's rainy.",["like","is","about"]],["What's the ___? I feel sick.",["matter","weather","problem"]],["She is very good ___ swimming.",["at","in","on"]],["My dog is ___ Rex.",["called","calls","name"]],["What ___ playing a game?",["about","like","for"]],["Let's go ___ a walk!",["for","to","at"]]],
 ["What's the weather like today?","I'm good at maths.","My cat is called Kitty.","What's the matter with you?"],
 []);

T("f-pcont",2,"🎬","Past continuous: estaba haciendo",
 "Para lo que <b>estaba pasando</b> en un momento del pasado: <b>was / were</b> + verbo <b>-ing</b>. Muchas veces con <b>when</b>: I was sleeping <b>when</b> the phone rang. <b>while</b> = mientras.",
 [["+","I was reading at eight o'clock.","A las ocho estaba leyendo."],["+","We were playing when it started to rain.","Estábamos jugando cuando empezó a llover."],["?","What were you doing yesterday at five?","¿Qué hacías ayer a las cinco?"]],
 [["I ___ watching TV when Dad came home.",["was","were","did"]],["They ___ swimming at ten o'clock.",["were","was","are"]],["What ___ you doing when I called?",["were","was","did"]],["She was ___ a cake when the cat jumped on the table.",["making","make","made"]],["It was raining ___ we went out.",["when","because","but"]],["We ___ sleeping. We were reading.",["weren't","wasn't","didn't"]]],
 ["I was eating when you called.","What were you doing?","They were playing in the garden.","She was reading a book."],
 [["I read a book.","Usa was + -ing","I was reading a book.",["were","read"]],["They were dancing.","Haz la pregunta ❓","Were they dancing?",["Was","Did"]]]);

T("f-pp",2,"🌍","Present perfect: ever / never",
 "Para <b>experiencias</b> de tu vida: <b>have / has</b> + participio (been, seen, eaten, visited). <b>Have you ever…?</b> = ¿Alguna vez has…? <b>never</b> = nunca.",
 [["?","Have you ever been to London?","¿Has estado alguna vez en Londres?"],["+","I have seen a whale.","He visto una ballena."],["−","She has never eaten sushi.","Nunca ha comido sushi."]],
 [["Have you ever ___ a dolphin?",["seen","saw","see"]],["She ___ been to Paris.",["has","have","is"]],["I have never ___ a horse.",["ridden","rode","ride"]],["___ you ever eaten snails?",["Have","Has","Did"]],["We have ___ Italy two times.",["visited","visit","visiting"]],["He has ___ been on a plane.",["never","ever","yet"]]],
 ["Have you ever been to Spain?","I have never seen a ghost.","She has visited London.","Has he ever eaten a snail?"],
 [["You have seen a lion.","Pregunta con ever","Have you ever seen a lion?",["Did","saw"]],["I have been to Rome.","Hazla con never","I have never been to Rome.",["ever","was"]]]);

T("f-yet",2,"⏳","Already, yet, just, since, for",
 "Con el present perfect: <b>just</b> = acabo de · <b>already</b> = ya · <b>yet</b> = todavía / ya (al final, en preguntas y negativas). <b>since</b> + momento (since 2020, since Monday) · <b>for</b> + tiempo (for two years).",
 [["+","I've just finished my homework.","Acabo de terminar los deberes."],["?","Have you finished yet?","¿Ya has terminado?"],["−","I haven't eaten yet.","Todavía no he comido."],["+","We've lived here since 2019.","Vivimos aquí desde 2019."]],
 [["I have ___ eaten my lunch. I'm not hungry.",["already","yet","since"]],["Have you done your homework ___?",["yet","already","just"]],["I've lived here ___ 2020.",["since","for","from"]],["She has had her cat ___ three years.",["for","since","ago"]],["He has ___ arrived. Say hello!",["just","yet","for"]],["We haven't finished ___.",["yet","already","just"]]],

 [["+","I'm going to play tennis on Saturday.","Voy a jugar al tenis el sábado."],["+","I think it will rain tomorrow.","Creo que mañana lloverá."],["−","She won't come to the party.","No vendrá a la fiesta."],["?","What are you going to do?","¿Qué vas a hacer?"]],
 [["Look at the clouds! It's going ___ rain.",["to","will","for"]],["I think you ___ like this book.",["will","are","going"]],["We're ___ to fly to London next week.",["going","go","will"]],["Don't worry, I ___ tell anyone.",["won't","don't","not"]],["What ___ you going to wear?",["are","will","do"]],["In the future people ___ live on Mars.",["will","are","going"]]],
 ["I'm going to buy a new bike.","Will you help me?","It won't be cold tomorrow.","What are you going to eat?"],
 [["I play football.","Usa going to","I'm going to play football.",["will","plays"]],["She comes.","Usa will","She will come.",["comes","going"]]]);

 [["+","It might rain later.","Quizás llueva luego."],["+","I may go to the beach tomorrow.","Puede que vaya a la playa mañana."],["−","She might not come.","Puede que no venga."]],
 [["Take a coat. It ___ be cold.",["might","must","has"]],["I'm not sure. I ___ go to the party.",["may","am","will to"]],["He might ___ late.",["be","is","being"]],["We may ___ a picnic tomorrow.",["have","has","having"]],["It ___ not snow. I'm not sure.",["might","is","does"]],["Where is Sam? He ___ be in the garden.",["may","is","does"]]],

 [["+","You should drink water.","Deberías beber agua."],["−","You shouldn't eat so many sweets.","No deberías comer tantos caramelos."],["?","Shall we go to the cinema?","¿Vamos al cine?"],["+","We could play a game.","Podríamos jugar a algo."]],
 [["You're tired. You ___ go to bed.",["should","shouldn't","shall"]],["You ___ watch TV all day.",["shouldn't","should","shall"]],["___ we play a game?",["Shall","Should","Do"]],["I'm bored. We ___ go to the park.",["could","shall","must to"]],["You should ___ your teeth.",["brush","brushes","to brush"]],["What ___ I do? I lost my key.",["should","must to","am"]]],

 ["It's cold, isn't it?","You can swim, can't you?","She likes cats, doesn't she?","They were late, weren't they?"],

 "<b>before</b> = antes de · <b>after</b> = después de · <b>until</b> = hasta que · <b>where</b> = donde · <b>so</b> = así que. Ejemplo: I brush my teeth <b>before</b> I go to bed.",

/* ============ STATE ============ */
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function newProfile(lvl){return {placed:true,level:lvl||0,done:false,m:{},wrong:{},stars:0,days:{},skill:{},exams:[],history:[]}}
var S=load()||{p:{}};
if(!S.students)S.students=[];KIDS=S.students;
KIDS.forEach(function(k){if(!S.p[k.id])S.p[k.id]=newProfile(k.lvl)});
var REVIEW_MIX=3;
function revItems(p,li){var a=[];for(var i=0;i<li;i++)a=a.concat(LEVELS[i].items);return a}
function revOK(p){for(var i=0;i<p.level;i++){if(prog(p,LEVELS[i].items).pct<UNLOCK)return false}return true}
function revGramPend(p){return GLIST.filter(function(t){return t.lvl<p.level&&gOf(p,t.id).medal<2})}
function revIsl(p){var h='';for(var i=0;i<p.level;i++){var L=LEVELS[i],pr=prog(p,L.items);
 h+='<div class="card" style="background:#f3f8ff"><h2>🔁 Repaso de '+L.icon+' '+L.name+' <span class="muted" style="font-size:16px">'+Math.round(pr.pct*100)+'%</span></h2>'+bar(pr.pct)+
 '<p class="muted">Si aciertas una palabra de repaso a la primera, ¡ya cuenta como sabida! Necesitas el 85% para el examen.</p><div class="islands">'+
 L.units.map(function(U){var up=prog(p,U.items);return '<button class="btn island" onclick="practice(\''+U.id+'\')"><span class="ic">'+U.icon+'</span><span class="nm">'+(up.l===up.t?'👑 ':'')+U.name+'</span>'+bar(up.pct,1)+'<span class="muted" style="font-size:14px">'+up.l+' / '+up.t+'</span></button>'}).join('')+'</div></div>'}
 return h}
var cur=null,SES=null,LOCK=false,SP=null,REG=[];
function P(){return S.p[cur]}
function kid(){return KIDS.filter(function(k){return k.id===cur})[0]}

/* ============ HELPERS ============ */
function $(s){return document.querySelector(s)}
function render(h){$('#app').innerHTML=h;window.scrollTo(0,0)}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function fmt(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function today(){return fmt(new Date())}
function mOf(p,id){return p.m[id]||0}
function learned(p,it){return mOf(p,it.id)>=LEARN}
function prog(p,items){var l=items.filter(function(i){return learned(p,i)}).length;return {l:l,t:items.length,pct:items.length?l/items.length:0}}
function streak(p){var d=new Date(),n=0;if(!p.days[fmt(d)])d.setDate(d.getDate()-1);while(p.days[fmt(d)]){n++;d.setDate(d.getDate()-1)}return n}
function pic(e){return e&&e.charAt(0)==='#'?'<span class="sw" style="background:'+e+'"></span>':e}
function reg(x){REG.push(x);return REG.length-1}
function gOf(p,tid){if(!p.g)p.g={};return p.g[tid]||(p.g[tid]={medal:0,diag:-1})}
function topicsOf(li){return GLIST.filter(function(t){return t.lvl===li})}
function gramDone(p,li){return topicsOf(li).filter(function(t){return gOf(p,t.id).medal>=2}).length}
function pendingT(p,t){var g=gOf(p,t.id);return g.medal<2&&(g.diag===0||g.diag===1||(t.lvl<p.level&&g.diag<0))}
function medalStr(m){return [1,2,3].map(function(i){return i<=m?MED[i]:'⚪'}).join('')}
function fill(arr,n){var a=shuffle(arr.slice()),out=[];if(!a.length)return out;for(var i=0;i<n;i++)out.push(a[i%a.length]);return out}
function rightOf(q){var it=q.it;if(it.kind==='gram')return it.q.replace('___',it.a);if(it.kind==='order')return it.s;if(it.kind==='trans')return it.ans;return it.w}
function bar(pct,sm){return '<div class="bar'+(sm?' sm':'')+'"><i style="width:'+Math.round(pct*100)+'%"></i></div>'}

/* ============ VOICE ============ */
var HAS_TTS=('speechSynthesis' in window), VOICE=null;
function pickVoice(){if(!HAS_TTS)return;var vs=speechSynthesis.getVoices();VOICE=vs.filter(function(v){return /en[-_]GB/i.test(v.lang)})[0]||vs.filter(function(v){return /^en/i.test(v.lang)})[0]||null}
if(HAS_TTS){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t){if(!HAS_TTS||!t)return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang=VOICE?VOICE.lang:'en-GB';if(VOICE)u.voice=VOICE;u.rate=0.85;speechSynthesis.speak(u)}catch(e){}}
function sayReg(i){say(REG[i])}

/* ============ SCREENS ============ */
function home(){
 cur=null;REG=[];
 var h='<div class="center"><h1 style="font-size:40px">🌍 EnglishMundo</h1><p class="big muted">Cambridge Starters · Movers · Flyers</p></div>';
 if(!KIDS.length)h+='<div class="card center pop"><div style="font-size:64px">👋</div><h2>¡Bienvenido!</h2><p class="big">Todavía no hay alumnos. Un adulto tiene que añadirlos.</p><button class="btn primary" style="font-size:24px" onclick="parentGate(\'add\')">➕ Añadir alumno</button></div>';
 else h+='<p class="big muted center">¿Quién va a jugar?</p><div class="profiles">'+KIDS.map(function(k){var p=S.p[k.id],lv=LEVELS[p.level];
  return '<button class="btn prof" onclick="pick(\''+k.id+'\')"><span class="av">'+k.av+'</span>'+esc(k.name)+
  '<div class="muted" style="font-size:16px;margin-top:6px">'+lv.icon+' '+lv.name+' · ⭐ '+p.stars+'</div></button>'}).join('')+'</div>';
 h+='<div class="row" style="margin-top:24px">'+(KIDS.length?'<button class="btn" onclick="parentGate(\'add\')">➕ Añadir alumno</button>':'')+'<button class="btn" onclick="parentGate()">🔐 Zona de adultos</button></div>';
 render(h);
}
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var NEW={av:'🦄',lvl:0};
function addStudent(back){
 NEW.back=back||'home';
 render('<div class="top"><button class="btn" onclick="'+(NEW.back==='parents'?'parents()':'home()')+'">⬅ Volver</button></div><div class="card"><h2>➕ Nuevo alumno</h2>'+
  '<p class="big">Nombre</p><input id="nm" type="text" maxlength="20" style="width:100%;text-align:left" placeholder="Nombre del alumno">'+
  '<p class="big">Elige un dibujo</p><div class="stickers" id="avs">'+AVATARS.map(function(a){return '<div class="btn" style="padding:6px;'+(a===NEW.av?'background:#ffe0b2':'')+'" onclick="NEW.av=\''+a+'\';addStudentRefresh()">'+a+'</div>'}).join('')+'</div>'+
  '<p class="big">¿En qué nivel empieza?</p><div class="row" style="justify-content:flex-start" id="lvs">'+LEVELS.map(function(l,i){return '<button class="btn'+(i===NEW.lvl?' primary':'')+'" onclick="NEW.lvl='+i+';addStudentRefresh()">'+l.icon+' '+l.name+'</button>'}).join('')+'</div>'+
  '<p class="muted">Si empieza en Movers o Flyers, tendrá que repasar el vocabulario y la gramática de los niveles anteriores.</p>'+
  '<div class="center"><button class="btn green" style="font-size:24px" onclick="saveStudent()">✔ Guardar</button></div><p id="nerr" style="color:#c62828" class="center"></p></div>');
}
function addStudentRefresh(){var v=$('#nm').value;addStudent(NEW.back);$('#nm').value=v}
function saveStudent(){var n=$('#nm').value.trim();if(!n){$('#nerr').textContent='Escribe un nombre';return}
 var id='a'+Date.now().toString(36);KIDS.push({id:id,name:n,av:NEW.av,lvl:NEW.lvl});S.p[id]=newProfile(NEW.lvl);save();
 var bk=NEW.back;NEW={av:'🦄',lvl:0};if(bk==='parents')parents();else home()}
function pick(id){cur=id;map()}
function header(){var k=kid(),p=P();
 return '<div class="top"><button class="btn" onclick="home()">🏠</button><div class="hud"><span class="pill" style="font-size:22px">'+k.av+' '+esc(k.name)+'</span><span class="pill">⭐ '+p.stars+'</span><span class="pill">🔥 '+streak(p)+' días</span></div></div>'}

function map(){
 REG=[];var p=P(),li=p.level,L=LEVELS[li],pr=prog(p,L.items),next=LEVELS[li+1];
 var need=Math.max(0,Math.ceil(pr.t*UNLOCK)-pr.l),gt=topicsOf(li).length,gneed=gt-gramDone(p,li);
 var rgp=revGramPend(p).length,rok=revOK(p),canExam=need===0&&gneed===0&&rok&&rgp===0;
 var pend=GLIST.filter(function(t){return pendingT(p,t)}).length;
 var revTxt='';for(var ri=0;ri<li;ri++){var rp=prog(p,LEVELS[ri].items);if(rp.pct<UNLOCK)revTxt+='<br>🔁 repaso de vocabulario de <b>'+LEVELS[ri].name+'</b> ('+Math.round(rp.pct*100)+'% de 85%)'}
 var goal;
 if(p.done)goal='🏆 <b>¡Has superado Flyers!</b> Sigue practicando para el examen de verdad.';
 else if(canExam)goal='🎉 <b>¡Ya puedes hacer el examen'+(next?' para pasar a '+next.name:' final de Flyers')+'!</b>';
 else goal='Para '+(next?'pasar a <b>'+next.icon+' '+next.name+'</b>':'aprobar <b>Flyers</b>')+' te faltan:'+(need?'<br>📚 <b>'+need+'</b> palabras de '+L.name:'')+(gneed?'<br>📘 <b>'+gneed+'</b> temas de gramática de '+L.name+' con 🥈':'')+revTxt+(rgp?'<br>📌 <b>'+rgp+'</b> temas de gramática de repaso con 🥈':'')+'<br>🏆 y aprobar el examen.';
 var path='<div class="path">'+LEVELS.map(function(l,i){var c=(i<li||(i===li&&p.done))?'done':(i===li?'now':'');var rv=i<li&&(prog(p,l.items).pct<UNLOCK||topicsOf(i).some(function(t){return gOf(p,t.id).medal<2}));if(rv)c='';return '<span class="step '+c+'">'+(rv?'🔁 ':(c==='done'?'✅ ':(i>li?'🔒 ':'')))+l.icon+' '+l.name+'</span>'}).join('<span>➜</span>')+'</div>';
 var isl=L.units.map(function(U){var up=prog(p,U.items);var crown=up.l===up.t?'👑 ':'';
  return '<button class="btn island" onclick="practice(\''+U.id+'\')"><span class="ic">'+U.icon+'</span><span class="nm">'+crown+U.name+'</span>'+bar(up.pct,1)+'<span class="muted" style="font-size:14px">'+up.l+' / '+up.t+'</span></button>'}).join('');
 render(header()+
 '<div class="card">'+path+'<h2 style="margin-top:12px">'+L.icon+' Nivel '+L.name+'</h2>'+bar(pr.pct)+
 '<p class="muted" style="margin:6px 0">📚 Palabras: <b>'+pr.l+'</b> de <b>'+pr.t+'</b> (el examen se abre al 85%) · 📘 Gramática: <b>'+(gt-gneed)+'</b> de <b>'+gt+'</b> temas con 🥈</p><p class="big" style="margin:8px 0">'+goal+'</p>'+
 '<div class="row" style="margin-top:12px"><button class="btn primary" onclick="practice()">▶ Jugar</button>'+
 '<button class="btn blue" onclick="grammarHome()">📘 Gramática'+(pend?' <span style="background:#ff9800;border-radius:10px;padding:0 8px">📌 '+pend+'</span>':'')+'</button>'+
 '<button class="btn" onclick="toLearn()">📋 Lo que me falta</button>'+
 (canExam?'<button class="btn green" onclick="examIntro()">🏆 Examen</button>':'<button class="btn" style="opacity:.55" onclick="toLearn()">🔒 Examen</button>')+
 '<button class="btn" onclick="stickers()">🎁 Stickers</button></div></div>'+
 '<h2>🏝️ Islas de '+L.name+'</h2><div class="islands">'+isl+'</div><div style="height:14px"></div>'+revIsl(p));
}

function toLearn(){
 REG=[];var p=P(),L=LEVELS[p.level],pr=prog(p,L.items);
 var need=Math.max(0,Math.ceil(pr.t*UNLOCK)-pr.l);
 var html=header()+'<div class="card"><button class="btn" onclick="map()">⬅ Volver</button><h2 style="margin-top:12px">📋 Lo que tengo que aprender para pasar '+L.name+'</h2>'+bar(pr.pct)+
  '<p class="big">'+(need>0?'Te faltan <b>'+need+'</b> para abrir el examen.':'¡Ya puedes hacer el examen! 🎉')+'</p>'+
  '<p class="muted">🟩 aprendida · 🟨 casi · ⬜ todavía no. Toca una palabra para oírla.</p></div>';
 html+='<div class="card"><h3>📘 Gramática de '+L.name+' <span class="muted" style="font-size:16px">('+gramDone(p,p.level)+'/'+topicsOf(p.level).length+' con 🥈)</span></h3><p class="muted">Necesitas al menos 🥈 en cada tema. Toca un tema para estudiarlo.</p><div class="words">'+
  topicsOf(p.level).map(function(t){var m=gOf(p,t.id).medal;return '<button class="wchip '+(m>=2?'l':(m>0?'p':''))+'" onclick="topic(\''+t.id+'\')">'+t.icon+' '+t.name+' '+medalStr(m)+'</button>'}).join('')+'</div>';
 var pl=GLIST.filter(function(t){return t.lvl<p.level&&pendingT(p,t)});
 if(pl.length)html+='<h3 style="margin-top:14px">📌 Repaso pendiente de niveles anteriores</h3><div class="words">'+pl.map(function(t){return '<button class="wchip p" onclick="topic(\''+t.id+'\')">'+t.icon+' '+t.name+'</button>'}).join('')+'</div>';
 html+='</div>';
 L.units.forEach(function(U){var up=prog(p,U.items);
  html+='<div class="card"><h3>'+U.icon+' '+U.name+' <span class="muted" style="font-size:16px">'+up.l+'/'+up.t+'</span> <button class="btn" style="font-size:16px;padding:8px 14px;float:right" onclick="practice(\''+U.id+'\')">▶ Practicar</button></h3><div class="words" style="clear:both;margin-top:10px">'+

function modesFor(it){
 if(it.kind==='gram')return ['gram'];
 var m=[];
 if(it.e&&HAS_TTS)m.push('listen');
 if(it.e)m.push('pic');
 if(it.d)m.push('def');
 if(it.es){m.push('es2en');m.push('en2es');if(HAS_TTS)m.push('listen2es')}
 if(/^[a-z]{3,10}$/i.test(it.w))m.push('spell');
 if(it.e)m.push('yesno');
 return m;
}
function distract(it,n,needE){
 var out=[],W={},E={},ES={};W[it.w]=1;if(it.e)E[it.e]=1;if(it.es)ES[it.es]=1;
 var pools=[shuffle(it.unit.items.slice()),shuffle(LEVELS[it.lvl].items.slice())];
 for(var a=0;a<pools.length;a++)for(var b=0;b<pools[a].length;b++){var x=pools[a][b];
  if(out.length>=n)return out;
  if(x.kind!=='word'||W[x.w])continue;if(needE&&!x.e)continue;if(x.e&&E[x.e])continue;if(x.es&&ES[x.es])continue;
  W[x.w]=1;if(x.e)E[x.e]=1;if(x.es)ES[x.es]=1;out.push(x);}
 return out;
}
function makeQ(it,mode,recog){
 if(it.kind==='order'||it.kind==='trans')return {it:it,mode:it.kind};
 if(mode==='gtf'){var q0={it:it,mode:'gtf'};q0.truth=Math.random()<0.5;var wr=it.o.filter(function(o){return o!==it.a});q0.shown=it.q.replace('___',q0.truth?it.a:rnd(wr));return q0}
 var ms=modesFor(it),r;
 if(!mode){
  if(recog){r=ms.filter(function(m){return m!=='spell'&&m!=='yesno'});if(r.length)ms=r}
  else if(mOf(P(),it.id)===0){r=ms.filter(function(m){return m!=='spell'});if(r.length)ms=r}
  mode=rnd(ms);
 }
 var q={it:it,mode:mode};
 if(mode==='gram'){q.opts=shuffle(it.o.slice());q.ans=q.opts.indexOf(it.a)}
 else if(mode==='listen'||mode==='pic'||mode==='def'||mode==='es2en'||mode==='en2es'||mode==='listen2es'){q.opts=shuffle([it].concat(distract(it,3,mode==='listen')));q.ans=q.opts.indexOf(it)}
 else if(mode==='yesno'){q.truth=Math.random()<0.5;q.shown=it.w;if(!q.truth){var d=distract(it,1)[0];if(d)q.shown=d.w;else q.truth=true}}
 return q;
}

function pickItems(pool,n){

 var i=0;while(out.length<n&&pool.length){out.push(out[i%Math.max(1,Math.min(out.length,pool.length))]);i++}

  else{p.done=true;html='<div style="font-size:90px">🏆</div><h1>¡Campeón/a de Flyers!</h1><p class="big">'+SES.sc+' de '+n+'. ¡Has terminado todos los niveles!</p>'}
 } else {
  html='<div style="font-size:72px">💪</div><h1>'+SES.sc+' de '+n+'</h1><p class="big">¡Casi! Necesitas '+EXAM_PASS+'. Repasa estas y vuelve a intentarlo:</p><div class="words" style="justify-content:center">'+
   SES.miss.map(function(it){var s=it.kind==='gram'?it.q.replace('___',it.a):it.w;return '<button class="wchip p" onclick="sayReg('+reg(s)+')">'+s+'</button>'}).join('')+'</div>';
 }
 save();
 render(header()+'<div class="card center pop">'+html+'<div class="row" style="margin-top:16px"><button class="btn primary" onclick="map()">🗺️ Ir al mapa</button></div></div>');
}

/* ============ GRAMMAR SCREENS ============ */
var EGC={'+':['#e8f5e9','#2e7d32'],'−':['#ffebee','#c62828'],'?':['#e3f2fd','#1565c0']};
function explain(t){
 return '<h2>'+t.icon+' '+t.name+'</h2><div style="font-size:20px;line-height:1.5">'+t.ex+'</div><div style="margin-top:12px">'+
  t.eg.map(function(e){var c=EGC[e[0]]||EGC['+'];return '<div style="background:'+c[0]+';border-left:6px solid '+c[1]+';border-radius:12px;padding:10px 12px;margin:8px 0;display:flex;align-items:center;gap:10px"><button class="btn" style="padding:6px 12px" onclick="sayReg('+reg(e[1])+')">🔊</button><div><div style="font-size:22px;font-weight:700;color:'+c[1]+'">'+e[1]+'</div><div class="muted">'+e[2]+'</div></div></div>'}).join('')+'</div>';
}
function grammarHome(){
 REG=[];var p=P();
 var pend=GLIST.filter(function(t){return pendingT(p,t)});
 var h=header()+'<div class="card"><button class="btn" onclick="map()">⬅ Mapa</button><h2 style="margin-top:12px">📘 Gramática</h2>'+
  '<p class="big">Cada tema tiene 3 medallas: 🥉 Elige · 🥈 Ordena · 🥇 Transforma. Para el examen de tu nivel necesitas 🥈 en todos sus temas.</p>'+
  '<div class="row"><button class="btn primary" onclick="gramMix()">🔀 Repaso mixto</button></div></div>';
 if(pend.length)h+='<div class="card" style="background:#fff8e1"><h3>📌 Repaso pendiente</h3><p class="muted">Temas que todavía no dominas. ¡Empieza por aquí!</p><div class="words">'+
  pend.map(function(t){return '<button class="wchip p" onclick="topic(\''+t.id+'\')">'+t.icon+' '+t.name+' <span class="muted">('+LEVELS[t.lvl].name+')</span></button>'}).join('')+'</div></div>';
 LEVELS.forEach(function(L,li){var ts=topicsOf(li);
  h+='<div class="card"><h3>'+L.icon+' '+L.name+' <span class="muted" style="font-size:16px">'+gramDone(p,li)+'/'+ts.length+' con 🥈</span></h3>'+
   (li<p.level?'<p class="muted">🔁 Repaso: si sacas 8 de 8 en el ejercicio 1, ¡ganas 🥈 directamente!</p>':'')+
   '<div class="islands">'+ts.map(function(t,i){var g=gOf(p,t.id);
    return '<button class="btn island" onclick="topic(\''+t.id+'\')"><span class="ic">'+t.icon+'</span><span class="nm">'+(i+1)+'. '+t.name+'</span><span style="font-size:22px">'+medalStr(g.medal)+'</span>'+
     (pendingT(p,t)?'<span style="display:block;font-size:14px;color:#e65100;margin-top:4px">📌 Repasar</span>':(g.diag===2&&g.medal<2?'<span style="display:block;font-size:14px;color:#2e7d32;margin-top:4px">✅ Lo sabes</span>':''))+'</button>'}).join('')+
   '</div></div>';
 });
 render(h);
}
function topic(tid){
 REG=[];var p=P(),t=GT[tid],m=gOf(p,tid).medal;
 function sb(st,label,desc){var open=m>=st-1;
  return '<button class="btn" style="width:100%;text-align:left;margin:6px 0;'+(open?'':'opacity:.5')+'" onclick="'+(open?'gramStage(\''+tid+'\','+st+')':'')+'"><span style="font-size:24px">'+(m>=st?MED[st]:(open?'▶':'🔒'))+' '+label+'</span><br><span class="muted" style="font-size:16px;font-weight:400">'+desc+'</span></button>'}
 render(header()+'<div class="card"><button class="btn" onclick="grammarHome()">⬅ Gramática</button><div style="margin-top:12px">'+explain(t)+'</div></div>'+
  '<div class="card"><h3>Ejercicios '+medalStr(m)+'</h3>'+
  sb(1,'1. Elige la correcta','Elige la palabra que falta y di si la frase está bien o mal. Gana 🥉 con '+STAGE_NEED[1]+' de '+STAGE_N[1]+'.')+
  sb(2,'2. Ordena la frase','Construye frases con fichas. Gana 🥈 con '+STAGE_NEED[2]+' de '+STAGE_N[2]+'.')+
  sb(3,'3. Transforma','Cambia frases: pregunta, negativa, pasado… Gana 🥇 con '+STAGE_NEED[3]+' de '+STAGE_N[3]+'.')+
  '</div>');
}
function gramStage(tid,st){
 var t=GT[tid],qs;
 if(st===1)qs=fill(t.mc,8).map(function(it,i){return makeQ(it,i%2?'gtf':'gram')});
 else if(st===2)qs=fill(t.or,4).map(function(it){return makeQ(it)}).concat(fill(t.mc,2).map(function(it){return makeQ(it,'gtf')}));
 else{var main=t.tr.length?fill(t.tr,Math.min(4,t.tr.length*2)):[];main=main.concat(fill(t.or,6-main.length));
  qs=main.map(function(it){return makeQ(it)}).concat(fill(t.mc,2).map(function(it){return makeQ(it,'gram')}))}
 SES={kind:'gram',tid:tid,stage:st,qs:shuffle(qs),i:0,sc:0,stars:0,learned:[],miss:[]};renderQ();
}
function gramMix(){
 var p=P(),ts=GLIST.filter(function(t){return gOf(p,t.id).medal>=1});
 if(!ts.length)ts=topicsOf(p.level);
 var pool=[];ts.forEach(function(t){pool=pool.concat(t.mc,t.or)});
 var qs=fill(pool,10).map(function(it){return it.kind==='gram'?makeQ(it,Math.random()<.5?'gram':'gtf'):makeQ(it)});
 SES={kind:'gmix',qs:qs,i:0,sc:0,stars:0,learned:[],miss:[]};renderQ();
}
function missChips(){var seen={};return SES.miss.filter(function(it){var r=rightOf({it:it});if(seen[r])return false;seen[r]=1;return true}).map(function(it){var r=rightOf({it:it});return '<button class="wchip p" onclick="sayReg('+reg(r)+')">'+r+'</button>'}).join('')}
function gramEnd(){
 REG=[];var p=P(),n=SES.qs.length,h,btns;
 if(SES.kind==='gram'){
  var g=gOf(p,SES.tid),st=SES.stage,pass=SES.sc>=STAGE_NEED[st],newM=pass&&g.medal<st;
  var shortcut=st===1&&SES.sc===n&&GT[SES.tid].lvl<p.level&&g.medal<2;
  if(newM)g.medal=st;
  if(shortcut){g.medal=2;newM=false}
  h='<div style="font-size:80px">'+(pass?MED[st]:'💪')+'</div><h1>'+SES.sc+' de '+n+' bien</h1>'+
   (shortcut?'<p class="big">⚡ ¡Atajo! ¡'+n+' de '+n+'! Este tema de repaso ya lo dominas: ganas 🥉 y 🥈 de golpe.</p>':'')+
   (newM?'<p class="big">¡Has ganado la medalla '+MED[st]+' en <b>'+GT[SES.tid].name+'</b>!</p>':(shortcut?'':pass?'<p class="big">¡Muy bien! Ya tenías esta medalla.</p>':'<p class="big">Necesitas '+STAGE_NEED[st]+' para la medalla '+MED[st]+'. ¡Otra vez!</p>'));
  btns='<button class="btn primary" onclick="gramStage(\''+SES.tid+'\','+st+')">🔁 Otra vez</button>'+
   (pass&&st<3?'<button class="btn green" onclick="gramStage(\''+SES.tid+'\','+(st+1)+')">Siguiente ejercicio ▶</button>':'')+
   '<button class="btn" onclick="topic(\''+SES.tid+'\')">📖 Volver al tema</button>';
 } else {
  h='<div style="font-size:72px">'+(SES.sc>=n*0.8?'🏆':'🌟')+'</div><h1>'+SES.sc+' de '+n+' bien</h1>';
  btns='<button class="btn primary" onclick="gramMix()">🔁 Otra vez</button><button class="btn" onclick="grammarHome()">📘 Gramática</button>';
 }
 if(SES.miss.length)h+='<p class="big">Repasa estas frases:</p><div class="words" style="justify-content:center">'+missChips()+'</div>';
 h+='<p class="big">+'+SES.stars+' ⭐</p>';
 p.history.push({d:today(),t:SES.kind==='gram'?'gramática: '+GT[SES.tid].name+' ('+SES.stage+')':'gramática: repaso mixto',sc:SES.sc,n:n});
 save();
 render(header()+'<div class="card center pop">'+h+'<div class="row" style="margin-top:12px">'+btns+'</div></div>');
}
function gramDiag(li){
 var qs=[];topicsOf(li).forEach(function(t){fill(t.mc,2).forEach(function(it){qs.push(makeQ(it,'gram'))})});
 render(header()+'<div class="card center pop"><div style="font-size:70px">🔎</div><h1>Prueba de gramática '+LEVELS[li].name+'</h1><p class="big">'+qs.length+' preguntas, 2 de cada tema. Así sabremos qué temas ya sabes y cuáles tienes que repasar.</p><p class="big">Si no lo sabes, ¡no pasa nada! 😊</p><div class="row"><button class="btn primary" id="gd">Empezar ▶</button><button class="btn" onclick="grammarHome()">Ahora no</button></div></div>');
 $('#gd').onclick=function(){SES={kind:'gdiag',li:li,qs:qs,i:0,sc:0,stars:0,learned:[],miss:[],per:{}};renderQ()};
}
function diagEnd(){
 REG=[];var p=P(),li=SES.li,ok=[],bad=[];
 topicsOf(li).forEach(function(t){var s=SES.per[t.id]||0,g=gOf(p,t.id);g.diag=s;if(s===2){if(g.medal<1)g.medal=1;ok.push(t)}else bad.push(t)});
 p.history.push({d:today(),t:'prueba gramática '+LEVELS[li].name,sc:SES.sc,n:SES.qs.length});save();
 function chips(a,c){return a.map(function(t){return '<button class="wchip '+c+'" onclick="topic(\''+t.id+'\')">'+t.icon+' '+t.name+'</button>'}).join('')}
 render(header()+'<div class="card pop"><h1 class="center">🔎 Resultado: '+SES.sc+' de '+SES.qs.length+'</h1>'+
  (ok.length?'<h3>✅ Ya lo sabes ('+ok.length+') — tienes 🥉, ¡a por la 🥈!</h3><div class="words">'+chips(ok,'l')+'</div>':'')+
  (bad.length?'<h3 style="margin-top:14px">📌 Tienes que repasar ('+bad.length+')</h3><div class="words">'+chips(bad,'p')+'</div>':'')+
  '<div class="row" style="margin-top:16px"><button class="btn primary" onclick="grammarHome()">📘 Ir a Gramática</button></div></div>');
}

/* ============ PARENTS ============ */
var GATE=null,GATE_NEXT='parents';
function parentGate(nx){GATE_NEXT=nx||'parents';var a=6+Math.floor(Math.random()*4),b=6+Math.floor(Math.random()*4);GATE=a*b;
 render('<div class="top"><button class="btn" onclick="home()">🏠</button></div><div class="card center"><h2>🔐 Zona de adultos</h2><p class="big">¿Cuánto es '+a+' × '+b+'?</p><input id="gate" type="number" inputmode="numeric"> <button class="btn primary" onclick="checkGate()">Entrar</button><p id="gerr" style="color:#c62828"></p></div>')}
function checkGate(){if(+$('#gate').value===GATE){if(GATE_NEXT==='add')addStudent('home');else parents()}else $('#gerr').textContent='Respuesta incorrecta'}
function parents(only){
 var html='<div class="top"><button class="btn" onclick="home()">🏠</button><h2>🔐 Zona de adultos</h2><button class="btn primary" onclick="addStudent(\'parents\')">➕ Añadir alumno</button></div>';
 html+='<div class="card"><h3>Resumen de alumnos ('+KIDS.length+')</h3>'+(KIDS.length?'<div style="overflow-x:auto"><table><tr><th>Alumno</th><th>Nivel</th><th>📚 Palabras</th><th>📘 Gramática</th><th>🔁 Repaso</th><th>⭐</th><th>Último día</th><th></th></tr>'+
  KIDS.map(function(k){var p=S.p[k.id],L=LEVELS[p.level],pr=prog(p,L.items),gt=topicsOf(p.level).length;
   var rv=p.level?Math.round(revItems(p,p.level).filter(function(it){return learned(p,it)}).length/revItems(p,p.level).length*100)+'%':'—';
   var ds=Object.keys(p.days).sort();var last=ds.length?ds[ds.length-1]:'—';
   return '<tr><td>'+k.av+' '+esc(k.name)+'</td><td>'+L.name+(p.done?' 🏆':'')+'</td><td>'+Math.round(pr.pct*100)+'%</td><td>'+gramDone(p,p.level)+'/'+gt+'</td><td>'+rv+'</td><td>'+p.stars+'</td><td>'+last+'</td><td><button class="btn" style="font-size:15px;padding:6px 12px" onclick="parents(\''+k.id+'\')">Ver</button></td></tr>'}).join('')+'</table></div>':'<p class="muted">Todavía no hay alumnos.</p>')+'</div>';
 KIDS.forEach(function(k){if(only!==k.id)return;
  var p=S.p[k.id],L=LEVELS[p.level],pr=prog(p,L.items);
  var weak=Object.keys(p.wrong).filter(function(id){return ITEMS[id]&&!learned(p,ITEMS[id])}).sort(function(a,b){return p.wrong[b]-p.wrong[a]}).slice(0,12);
  var days=[];for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var key=fmt(d);days.push('<td class="center">'+['D','L','M','X','J','V','S'][d.getDay()]+'<br><b>'+(p.days[key]||0)+'</b></td>')}
  var tot=0;Object.keys(p.days).forEach(function(d){tot+=p.days[d]});
  html+='<div class="card" id="det"><h2>'+k.av+' '+esc(k.name)+'</h2>'+
  (p.placed?'<p class="big">'+L.icon+' <b>'+L.name+'</b> · '+Math.round(pr.pct*100)+'% aprendido ('+pr.l+'/'+pr.t+')'+(p.done?' · 🏆 Flyers superado':'')+'</p>'+bar(pr.pct):'<p class="big">Prueba inicial pendiente</p>')+
  '<p>⭐ '+p.stars+' estrellas · 🔥 racha '+streak(p)+' días · '+tot+' preguntas en total</p>'+
  '<h3>Últimos 7 días (preguntas)</h3><table><tr>'+days.join('')+'</tr></table>'+
  '<h3>Acierto por destreza</h3><table>'+Object.keys(SKILL).map(function(s){var v=p.skill[s];return '<tr><td>'+SKILL[s]+'</td><td>'+(v?Math.round(v[0]/v[1]*100)+'% ('+v[1]+')':'—')+'</td></tr>'}).join('')+'</table>'+
  (p.level>0?'<p><b>🔁 Repaso vocabulario:</b> '+LEVELS.slice(0,p.level).map(function(l){return l.name+' '+Math.round(prog(p,l.items).pct*100)+'%'}).join(' · ')+' (necesita 85%)</p>':'')+
  '<h3>Gramática</h3><table>'+LEVELS.map(function(l,li){var ts=topicsOf(li);return '<tr><td>'+l.icon+' '+l.name+'</td><td>'+ts.map(function(t){return '<span title="'+t.name+'">'+MED[gOf(p,t.id).medal]+'</span>'}).join(' ')+'</td><td>'+gramDone(p,li)+'/'+ts.length+' 🥈</td></tr>'}).join('')+'</table>'+
  (function(){var pd=GLIST.filter(function(t){return pendingT(p,t)});return '<p><b>📌 Repaso pendiente:</b> '+(pd.length?pd.map(function(t){return t.name+' ('+LEVELS[t.lvl].name+')'}).join(', '):'ninguno')+'</p>'})()+
  (function(){var gw=p.gw||{},ks=Object.keys(gw).filter(function(k){return GT[k]}).sort(function(a,b){return gw[b]-gw[a]}).slice(0,6);return '<p><b>Temas con más fallos:</b> '+(ks.length?ks.map(function(k){return GT[k].name+' ×'+gw[k]}).join(', '):'—')+'</p>'})()+
  '<h3>Palabras que más falla</h3><div class="words">'+(weak.length?weak.map(function(id){var it=ITEMS[id];return '<span class="wchip p">'+(it.kind==='gram'?it.q.replace('___',it.a):it.w)+' ×'+p.wrong[id]+'</span>'}).join(''):'<span class="muted">Ninguna todavía</span>')+'</div>'+
  '<h3>Historial</h3><div class="muted" style="font-size:15px">'+(p.history.slice(-8).reverse().map(function(h){return h.d+' · '+h.t+(h.n?' · '+h.sc+'/'+h.n:'')+(h.res?' · aciertos por nivel: '+h.res.join(' / ')+' de 8':'')+(h.pass===true?' ✅':h.pass===false?' ❌':'')}).join('<br>')||'—')+'</div>'+
  '<h3>Ajustes</h3><p class="muted">Nivel actual: '+L.name+'</p><div class="row" style="justify-content:flex-start">'+LEVELS.map(function(l,i){return '<button class="btn" style="font-size:16px" onclick="setLevel(\''+k.id+'\','+i+')">Poner en '+l.name+'</button>'}).join('')+
  '<button class="btn red" style="font-size:16px" onclick="resetKid(\''+k.id+'\')">Borrar progreso</button><button class="btn" style="font-size:16px" onclick="renameKid(\''+k.id+'\')">✏️ Cambiar nombre</button><button class="btn red" style="font-size:16px" onclick="deleteKid(\''+k.id+'\')">🗑️ Eliminar alumno</button></div></div>';
 });
 html+='<p class="muted center">El progreso se guarda en este navegador de este dispositivo. No borres los datos del navegador.</p>';
 render(html);if(only){var c=document.getElementById('det');if(c)c.scrollIntoView()}
}
function setLevel(id,li){var p=S.p[id];p.level=li;p.placed=true;p.done=false;save();parents(id)}
function renameKid(id){var k=KIDS.filter(function(x){return x.id===id})[0];var n=prompt('Nuevo nombre',k.name);if(n&&n.trim()){k.name=n.trim();save()}parents(id)}
function deleteKid(id){if(!confirm('¿Eliminar este alumno y todo su progreso?'))return;for(var i=0;i<KIDS.length;i++)if(KIDS[i].id===id){KIDS.splice(i,1);break}delete S.p[id];save();parents()}
function resetKid(id){if(confirm('¿Seguro? Se borrará todo el progreso de este alumno.')){var k=KIDS.filter(function(x){return x.id===id})[0];S.p[id]=newProfile(k.lvl);save();parents(id)}}

home();
</script>
